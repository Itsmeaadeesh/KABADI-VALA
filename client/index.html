    <!-- PWA / Dynamic Chunk Cache Self-Healing System -->
    <script>
      (function() {
        function triggerCacheBustAndReload(reason) {
          console.warn('[PWA Self-Healing] Triggered by:', reason);
          var key = '__pwa_reload_ts';
          var last = sessionStorage.getItem(key);
          var now = Date.now();
          // Avoid infinite loops (allow at most one auto-reload per 12 seconds)
          if (!last || (now - parseInt(last, 10)) > 12000) {
            sessionStorage.setItem(key, now.toString());
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(n) { caches.delete(n); });
              });
            }
            setTimeout(function() {
              window.location.reload(true);
            }, 100);
          }
        }

        // 1. Vite chunk load failure
        window.addEventListener('vite:preloadError', function(e) {
          triggerCacheBustAndReload('vite:preloadError');
        });

        // 2. Module script MIME error or missing chunk script error
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message.toLowerCase() : '';
          if (
            msg.indexOf('failed to load module') !== -1 ||
            msg.indexOf('mime type') !== -1 ||
            msg.indexOf('loading chunk') !== -1 ||
            msg.indexOf('dynamically imported module') !== -1 ||
            msg.indexOf('unexpected token <') !== -1
          ) {
            triggerCacheBustAndReload(msg);
          }
        }, true);

        // 3. Unhandled rejection from dynamic imports
        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) ? (e.reason.message || String(e.reason)).toLowerCase() : '';
          if (
            reason.indexOf('failed to fetch dynamically imported module') !== -1 ||
            reason.indexOf('loading chunk') !== -1 ||
            reason.indexOf('mime type') !== -1
          ) {
            triggerCacheBustAndReload(reason);
          }
        });

        // 4. Proactive ServiceWorker update check
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(reg) {
              reg.update().catch(function() {});
            });
          });
        }
      })();
